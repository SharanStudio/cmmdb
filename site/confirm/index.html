<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>Confirm · CMM Directory</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#16181a; --paper:#fbfbf8; --line:#d6d8d3; --muted:#5a6066; --gold:#f0a500; --soft:#f2f2ee; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--ink); color:#fff; padding:24px 20px; }
  header div, main { max-width:560px; margin:0 auto; }
  header a { color:var(--gold); text-decoration:none; font-weight:700; }
  main { padding:24px 20px 64px; }
  .card { border:1px solid var(--line); background:var(--soft); border-radius:10px; padding:14px 16px; margin:14px 0; }
  .card p { margin:.2rem 0; }
  .muted { color:var(--muted); font-size:.9rem; }
  button { font:inherit; font-weight:700; padding:12px 22px; border:0; border-radius:8px; background:var(--gold); color:#16181a; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  [hidden] { display:none !important; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f2; --paper:#141516; --line:#333; --muted:#aaa; --soft:#1d1f20; }
    header { background:#000; }
  }
</style>
</head>
<body>
<header><div><a href="/">← CMM Directory</a></div></header>
<main>
  <h1 id="title">Checking your link…</h1>
  <div id="details" class="card" hidden></div>
  <p id="msg"></p>
  <button id="go" type="button" hidden>Confirm</button>
  <p class="muted">Questions? Write to <a href="mailto:admincmmonline@gmail.com">admincmmonline@gmail.com</a>.</p>
</main>
<script src="confirm.js"></script>
</body>
</html>
